name: Council
options:
  bundleIdPrefix: me.opencouncil
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  CouncilCore:
    path: CouncilCore
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.19.0
  Textual:
    # 0.5.0 with the macOS selection layout fix documented in Vendor/Textual/COUNCIL-PATCH.md.
    path: Vendor/Textual
targets:
  Council:
    type: application
    platform: macOS
    sources:
      - path: Council
        excludes: ["Tests/**"]
      - path: Resources
        type: folder
        buildPhase: resources
    dependencies:
      - package: CouncilCore
      - package: SwiftTerm
      - package: Textual
    info:
      path: Council/Info.plist
      properties:
        ATSApplicationFontsPath: Resources/Fonts
        CFBundleDisplayName: Open Council
        CFBundleName: Council
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        NSPrincipalClass: NSApplication
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.opencouncil.app
        PRODUCT_NAME: Council
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_STYLE: Manual
        # Filled in from the environment by build.sh, which reads the untracked app/signing.local. Ad-hoc
        # ("-") when there is none, so a clone builds for anyone; a real identity when there is one, because
        # TCC keys its grants to the signature and an ad-hoc one changes with every build.
        CODE_SIGN_IDENTITY: "${COUNCIL_CODE_SIGN_IDENTITY}"
        DEVELOPMENT_TEAM: "${COUNCIL_DEVELOPMENT_TEAM}"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  CouncilAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Council/Tests
    dependencies:
      - target: Council
    settings:
      base:
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        # The test bundle is injected into the app, so it signs the same way the host does.
        CODE_SIGN_IDENTITY: "${COUNCIL_CODE_SIGN_IDENTITY}"
        DEVELOPMENT_TEAM: "${COUNCIL_DEVELOPMENT_TEAM}"
schemes:
  Council:
    build:
      targets:
        Council: all
        CouncilAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [CouncilAppTests]
